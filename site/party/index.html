<style>
/* ---------- party mode: its own bubbly look (big screen + phones) ---------- */
:root{--pv:#2E1F66;--pv2:#3D2A85;--pv3:#5038A8;--pcard:#FFFFFF;--pink:#FF7AB6;--yel:#FFD15C;--mint:#5CE1B8;--sky:#6CC4FF;--pink2:#E0559A;--yel2:#E8B437;--mint2:#34BE94;--sky2:#3FA3E6;
  --pink-ink:#4A0E2C;--yel-ink:#4A3300;--mint-ink:#0B3D2E;--sky-ink:#0A2E4A;--ptext:#FFF8F0;--pmuted:#D9D0FF;--pdark:#1B1240;--fb:"Baloo Bhaijaan 2","Cairo","Figtree",system-ui,sans-serif}
html.party,html.party body,:root.party[data-theme] body{background:var(--pv)!important;color:var(--ptext)}
.party body{font-family:var(--fb)}
.party .wrap{max-width:none;padding:0}
.party-tv .rbar,.party-tv .rfoot{display:none!important} /* the big screen shows only the party */
#pty{min-height:100dvh;position:relative;overflow:hidden;font-family:var(--fb)}
#pty *{font-family:inherit}
/* soft floating blobs behind everything */
.blobs{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;opacity:.22;filter:blur(2px);animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:42vmax;height:42vmax;background:var(--pink);top:-14vmax;inset-inline-start:-10vmax}
.blobs i:nth-child(2){width:34vmax;height:34vmax;background:var(--sky);bottom:-12vmax;inset-inline-end:-8vmax;animation-delay:-6s}
.blobs i:nth-child(3){width:20vmax;height:20vmax;background:var(--yel);top:40%;inset-inline-start:46%;animation-delay:-11s;opacity:.14}
@keyframes drift{to{transform:translate(4vmax,3vmax) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.blobs i,.chr,.chr .body,.tvq .pulse{animation:none!important}}
.pbtn{appearance:none;border:0;border-radius:999px;padding:0 28px;min-height:56px;font-weight:800;font-size:20px;cursor:pointer;color:var(--yel-ink);background:var(--yel);
  box-shadow:0 6px 0 var(--yel2);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.pbtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--yel2)}
.pbtn:focus-visible{outline:4px solid #fff;outline-offset:3px}
.pbtn.pink{background:var(--pink);color:var(--pink-ink);box-shadow:0 6px 0 var(--pink2)}
.pbtn.mint{background:var(--mint);color:var(--mint-ink);box-shadow:0 6px 0 var(--mint2)}
.pbtn.sky{background:var(--sky);color:var(--sky-ink);box-shadow:0 6px 0 var(--sky2)}
.pbtn.ghost{background:rgba(255,255,255,.12);color:var(--ptext);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.pbtn:disabled{opacity:.45;cursor:default;transform:none}
.pcard{background:var(--pcard);color:var(--pdark);border-radius:32px;padding:24px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.pchip{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:700}
.ptitle{margin:0;font-weight:800;line-height:1.05;letter-spacing:-.01em}
.seg2{display:inline-flex;padding:5px;border-radius:999px;background:rgba(0,0,0,.25);gap:4px;flex-wrap:wrap}
.seg2 button{appearance:none;border:0;border-radius:999px;min-height:44px;padding:0 18px;font-weight:800;font-size:17px;color:var(--pmuted);background:transparent;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:#fff;color:var(--pdark)}
.seg2 button:disabled{opacity:.5;cursor:default}
.seg2 button small{font-size:12px;font-weight:700;opacity:.8;margin-inline-start:6px}
.pnote{color:var(--pmuted);font-size:16px;margin:0;line-height:1.45}
.pwarn{color:#FFB3C9;font-weight:700}
.ltrx{direction:ltr;unicode-bidi:isolate}
/* landing */
.land{min-height:100dvh;display:grid;place-items:center;padding:24px 16px;position:relative}
.land-in{display:grid;gap:22px;max-width:560px;width:100%;text-align:center;justify-items:center}
.land h1{font-size:clamp(44px,9vw,76px)}
.land .pcard{width:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;text-align:start}
.land .row{display:flex;gap:10px;flex-wrap:wrap}
.pin{width:100%;min-height:56px;border-radius:18px;border:3px solid #E6E0FF;padding:0 16px;font-size:22px;font-weight:800;color:var(--pdark);background:#F7F5FF}
.pin:focus{outline:none;border-color:var(--pv3)}
#pCodeIn{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-family:"Saira","Baloo Bhaijaan 2",sans-serif;flex:1;min-width:0}
/* ---------- TV ---------- */
.tv{min-height:100dvh;display:grid;grid-template-columns:minmax(300px,30%) 1fr;gap:28px;padding:28px;position:relative;box-sizing:border-box}
@media (max-width:900px){.tv{grid-template-columns:1fr}}
.tvside{display:flex;flex-direction:column;gap:20px;min-width:0}
.tvbrand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px}
.tvbrand .dots{display:flex;gap:5px}.tvbrand .dots i{width:14px;height:14px;border-radius:50%}
.tvq{display:grid;gap:12px;justify-items:center;text-align:center}
.tvq .qrbox{background:#fff;border-radius:28px;padding:16px;box-shadow:0 10px 0 rgba(0,0,0,.25);position:relative}
.tvq .qrbox svg{display:block;width:min(260px,26vw);height:auto}
@media (max-width:900px){.tvq .qrbox svg{width:200px}}
.tvq .pulse{position:absolute;inset:-10px;border-radius:36px;border:4px solid var(--yel);animation:pulse 2.4s ease-out infinite;pointer-events:none}
@keyframes pulse{from{opacity:.9;transform:scale(.98)}to{opacity:0;transform:scale(1.08)}}
.tvq .code{font-family:"Saira","Baloo Bhaijaan 2",sans-serif;font-weight:800;font-size:clamp(48px,6vw,84px);letter-spacing:.18em;line-height:1;color:var(--yel)}
.tvq .url{font-size:20px;font-weight:700;color:var(--pmuted)}
.tvmain{display:flex;flex-direction:column;gap:18px;min-width:0}
.tvhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tvhead h1{font-size:clamp(34px,4vw,56px)}
.stage{position:relative;flex:1;min-height:360px;border-radius:40px;background:var(--pv2);
  background-image:radial-gradient(rgba(255,255,255,.07) 2px,transparent 2.5px);background-size:34px 34px;box-shadow:inset 0 8px 0 rgba(0,0,0,.18);overflow:hidden}
.stage .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:clamp(20px,2.2vw,30px);font-weight:700;color:var(--pmuted)}
.chr{position:absolute;width:96px;margin-inline-start:-48px;margin-top:-118px;transition:left .22s linear,top .22s linear;display:grid;justify-items:center}
.chr .tag{background:#fff;color:var(--pdark);font-weight:800;font-size:18px;border-radius:999px;padding:2px 14px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 0 rgba(0,0,0,.2);margin-bottom:6px}
.chr .say{position:absolute;bottom:calc(100% + 6px);background:#fff;color:var(--pdark);font-weight:700;font-size:20px;line-height:1.25;border-radius:20px;padding:8px 14px;
  max-width:260px;width:max-content;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:pop .25s cubic-bezier(.3,1.6,.6,1)}
.chr .say::after{content:"";position:absolute;bottom:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.chr svg{width:84px;height:84px;overflow:visible}
.chr .body{transform-origin:50% 100%}
.chr.walk .body{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-5px) scaleY(.96)}}
.chr.jump .body{animation:hop .55s cubic-bezier(.3,.7,.4,1)}
@keyframes hop{40%{transform:translateY(-38px) scale(1.05,.95)}80%{transform:translateY(0) scale(1.08,.9)}}
.chr.left svg{transform:scaleX(-1)}
.chr .eye{animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tvbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:rgba(0,0,0,.22);border-radius:32px;padding:14px 16px}
.tvbar .grp{display:grid;gap:6px}
.tvbar .lbl2{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pmuted)}
:root[lang="ar"] .tvbar .lbl2{letter-spacing:0;font-size:15px;text-transform:none}
.tvbar .go{margin-inline-start:auto;min-height:72px;font-size:26px;padding:0 40px}
.pcount{font-size:20px;font-weight:800;color:var(--ptext)}
/* ---------- phone ---------- */
.ph{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);align-content:start;gap:16px;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;position:relative;box-sizing:border-box}
.ph .ptop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ph .ptop .code{font-family:"Saira",sans-serif;font-weight:800;letter-spacing:.2em;color:var(--yel)}
.ph .pcard{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.ph .me{display:flex;align-items:center;gap:14px}
.ph .me svg{width:76px;height:76px;flex:none;overflow:visible}
.ph .me b{font-size:26px;line-height:1.1}
.swatch{display:flex;gap:10px;flex-wrap:wrap}
.swatch button{width:44px;height:44px;border-radius:50%;border:4px solid transparent;cursor:pointer}
.swatch button[aria-pressed="true"]{border-color:var(--pdark);box-shadow:0 0 0 3px #fff inset}
.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,72px);gap:8px;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button{border:0;border-radius:22px;background:var(--pv3);color:#fff;font-size:30px;box-shadow:0 6px 0 rgba(0,0,0,.3);touch-action:none;cursor:pointer;display:grid;place-items:center}
.pad button:active,.pad button.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.3);background:var(--sky);color:var(--sky-ink)}
.pad button svg{width:30px;height:30px}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.pad .j{grid-column:2;grid-row:2;background:var(--pink);color:var(--pink-ink);font-size:16px;font-weight:800}
.chat{display:flex;gap:8px}
.chat input{flex:1;min-width:0;width:0;min-height:52px;border-radius:999px;border:3px solid #E6E0FF;padding:0 18px;font-size:18px;font-weight:700;color:var(--pdark);background:#F7F5FF}
.chat input:focus{outline:none;border-color:var(--pv3)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.hostpanel{background:#fff;color:var(--pdark);border-radius:28px;padding:18px;display:grid;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.15);border:3px solid var(--yel)}
.hostpanel>b{font-size:20px}.hostpanel .pnote{margin:0;color:#5B5480}
.hostline{color:#fff;font-weight:800;text-align:center}
.hg{display:grid;gap:6px}.lbl3{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:#7A72A8}
.seg3{display:flex;gap:6px;flex-wrap:wrap}
.seg3 button{min-height:44px;border-radius:999px;border:0;padding:0 14px;font-weight:800;font-size:15px;background:#EFEAFF;color:var(--pdark);cursor:pointer}
.seg3 button[aria-pressed="true"]{background:var(--pdark);color:#fff}
.chr{pointer-events:auto;cursor:pointer}.chr.host .tag{background:var(--yel)}
.apbox{background:rgba(255,214,102,.16);border:3px solid var(--yel);border-radius:24px;padding:12px 16px;display:grid;gap:8px;text-align:start}
.apit{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.apit span{flex:1;min-width:0;font-size:20px}
.apit .pbtn{min-height:44px;font-size:17px;padding:0 18px}
.quick button{min-height:44px;border-radius:999px;border:0;padding:0 16px;font-weight:800;font-size:16px;background:#EFEAFF;color:var(--pdark);cursor:pointer}
.pstatus{text-align:center;font-size:20px;font-weight:800}
/* ---------- Harf on the TV ---------- */
.hf{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:18px;padding:24px 28px;box-sizing:border-box;position:relative}
.hfhead{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hfhead .mini{display:flex;align-items:center;gap:14px}
.hfhead .mini svg{width:76px;height:76px;background:#fff;border-radius:14px;padding:6px}
.hfhead .mini .code{font-family:"Saira",sans-serif;font-weight:800;font-size:30px;letter-spacing:.16em;color:var(--yel)}
.hfbody{display:grid;grid-template-columns:1fr minmax(260px,24%);gap:24px;min-height:0}
@media (max-width:900px){.hfbody{grid-template-columns:1fr}}
.hfcenter{display:grid;align-content:safe center;overflow:auto;min-height:0;justify-items:center;gap:20px;text-align:center;min-width:0}
.letter{font-weight:800;font-size:clamp(160px,22vw,300px);line-height:1;color:var(--yel);text-shadow:0 12px 0 rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.3,1.6,.6,1)}
.letter.latin{font-family:"Saira","Baloo Bhaijaan 2",sans-serif}
.cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cats span{background:rgba(255,255,255,.14);border-radius:999px;padding:6px 18px;font-weight:800;font-size:22px}
.tbar{width:min(900px,90%);height:22px;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden}
.tbar i{display:block;height:100%;border-radius:999px;background:var(--mint);transition:width .2s linear}
.tbar.stop i{background:var(--pink)}
.secs{font-family:"Saira",sans-serif;font-weight:800;font-size:44px}
.stopban{background:var(--pink);color:var(--pink-ink);font-weight:800;font-size:34px;border-radius:999px;padding:8px 30px;box-shadow:0 6px 0 var(--pink2);animation:pop .3s cubic-bezier(.3,1.6,.6,1)}
.bigmsg{font-size:clamp(36px,5vw,64px);font-weight:800}
.plist{display:grid;gap:10px;align-content:start;overflow:auto;min-height:0}
.prow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;background:rgba(255,255,255,.1);border-radius:24px;padding:8px 14px}
.prow svg{width:52px;height:52px;overflow:visible}
.prow b{font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .st{font-weight:800;font-size:18px;color:var(--pmuted);display:flex;align-items:center;gap:6px}
.prow .st.done{color:var(--mint)}
.pips{display:flex;gap:4px}.pips i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2)}.pips i.on{background:var(--yel)}
.prow .sc{font-family:"Saira",sans-serif;font-weight:800;font-size:24px}
.prow.lead{background:var(--yel);color:var(--yel-ink)}.prow.lead .st{color:var(--yel-ink)}
.hres{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:20px}
.hres th{font-weight:800;color:var(--pmuted);font-size:17px;padding:0 10px;text-align:start}
.hres td{background:rgba(255,255,255,.1);padding:10px;font-weight:700;vertical-align:middle}
.hres td:first-child{border-start-start-radius:18px;border-end-start-radius:18px}
.hres td:last-child{border-start-end-radius:18px;border-end-end-radius:18px;font-family:"Saira",sans-serif;font-weight:800;font-size:24px;text-align:end;white-space:nowrap}
.hres .hwho{display:flex;align-items:center;gap:10px;font-weight:800;white-space:nowrap}
.hres .hwho svg{width:40px;height:40px;overflow:visible}
/* a big party: smaller rows so the whole table, the scores and the buttons fit on the screen */
.hf.many .plist{gap:6px}.hf.many .prow{grid-template-columns:34px minmax(0,1fr) auto;padding:3px 12px;border-radius:16px}.hf.many .prow svg{width:34px;height:34px}
.hf.many .prow b{font-size:17px}.hf.many .prow .sc{font-size:19px}.hf.many .pips i{width:9px;height:9px}
.hf.many .hres{font-size:16px;border-spacing:0 4px}.hf.many .hres td{padding:4px 8px}.hf.many .hres td:last-child{font-size:18px}
.hf.many .hres .hwho svg{width:26px;height:26px}.hf.many .ans small{font-size:12px}.hf.many .hfcenter .bigmsg{font-size:clamp(26px,3vw,40px)}
.hf.many .hfcenter{gap:10px}
.hf.many .ans{flex-direction:row;align-items:baseline;gap:5px}.hf.many .hres th{font-size:15px}
.ans{display:inline-flex;flex-direction:column;line-height:1.15}
.ans small{font-size:14px;font-weight:800}
button.ans{appearance:none;background:none;border:0;padding:4px 8px;margin:-4px -8px;border-radius:12px;color:inherit;font:inherit;cursor:pointer;text-align:inherit}
button.ans:hover{background:rgba(255,255,255,.12)}button.ans:focus-visible{outline:3px solid var(--yel)}
.ans.ov{box-shadow:inset 0 0 0 2px var(--yel)}
.unchk td{opacity:.6}.unchk td:last-child{font-size:16px;font-family:inherit}
.ans.u small{color:var(--mint)}.ans.s small{color:var(--yel)}.ans.x{opacity:.5;text-decoration:line-through}.ans.x small{text-decoration:none}
.hffoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.hffoot .nx{font-size:22px;font-weight:800;margin-inline-end:auto}
/* ---------- Trivia and Hangman on the TV ---------- */
.psel{min-height:44px;border-radius:999px;border:0;padding:0 16px;font-weight:800;font-size:17px;background:#fff;color:var(--pdark);max-width:100%}
.tq{font-size:clamp(26px,3.2vw,50px);font-weight:800;line-height:1.2;max-width:1100px}
.tpic{background:#fff;border-radius:28px;padding:16px;box-shadow:0 10px 0 rgba(0,0,0,.25)}
.tpic img{display:block;width:auto;height:clamp(120px,22vh,240px)}
.tpic.flag img{border-radius:6px;box-shadow:0 0 0 2px rgba(0,0,0,.1)}
.tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;direction:ltr}
.tiles.ar{direction:rtl}

/* ---------- Trivia and Hangman on the TV ----------
   Unlike Harf, these run in the party room itself: phones stay on this page and turn into answer pads and keyboards.
   The big screen keeps the round on the shared clock (Rush.now) in its presence (gm) and scores everything; each phone
   puts its own answers in its presence (ta: trivia answers for the round, hg: hangman guesses). Scores are kept by
   player id for the whole game (gTot), so a new name or a reload never loses points. */
const TQ=R.TRIVIA,TQ_N=TQ.QUESTIONS,TQ_MS=TQ.DIFF.normal.ms,TQ_REV=TQ.REVEAL_MS,TQ_COUNT=TQ.COUNT_MS,TQ_FAST=TQ.FAST_MS;
const HMW=window.HM_WORDS&&HM_WORDS.en?HM_WORDS:{en:{},ar:{}},HM_MS=60000,HM_MISS=6,HM_COUNT=3000;
const AR_SAME={"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ة":"ه","ى":"ي","ئ":"ي","ؤ":"و"},keyOf=ch=>AR_SAME[ch]||ch;
const ROWS_EN=["QWERTYUIOP","ASDFGHJKL","ZXCVBNM"],ROWS_AR=["ضصثقفغعهخحج","شسيبلاتنمك","ءرزوظطذد"];
const KEYSET={en:new Set(ROWS_EN.join("")),ar:new Set(ROWS_AR.join(""))};
const TOPICS=["mix","letters"].concat(TQ.CATS);
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickOf=a=>a[Math.floor(Math.random()*a.length)];
let gTot={},gRound={}; // game totals by player id; this round's points by player id (one entry per question)
const pid=p=>String(p.presence.u||p.peer);

/* the question banks: the room bank (site/trivia/questions.json) and the party's picture questions, by id */
let QB=null,QB_LOAD=null;
function loadBank(){
  if(QB)return Promise.resolve(QB);
  if(!QB_LOAD)QB_LOAD=Promise.all([Rush.trivia.bank(),fetch("/party/pictures.json",{cache:"no-cache"}).then(r=>r.ok?r.json():{q:[]}).catch(()=>({q:[]}))])
    .then(([a,b])=>{const m=new Map();
      for(const x of a.q||[])m.set(x[0],{id:x[0],c:x[1],d:x[2],q:[x[3],x[4]],a:[x[5],x[6]]});
      for(const x of b.q||[])if(/^(flag|emoji)\/[a-z0-9-]+$/.test(x[7]||""))m.set(x[0],{id:x[0],c:x[1],d:x[2],q:[x[3],x[4]],a:[x[5],x[6]],img:x[7]});
      QB=m;return m})
    .catch(e=>{QB_LOAD=null;throw e});
  return QB_LOAD;
}
/* letter scramble: a Hangman word with its letters shuffled; the answers are that word and three words of the same
   category and similar length. Everything is in the id (language, category, the four word numbers), so every phone
   builds the same question. */
function letterQ(lg){
  const L=HMW[lg]||{},cats=Object.keys(L).filter(c=>L[c].length>=4);if(!cats.length)return null;
  const c=pickOf(cats),list=L[c],i=Math.floor(Math.random()*list.length),n=[...list[i][0]].length;
  let others=list.map((e,k)=>k).filter(k=>k!==i&&Math.abs([...list[k][0]].length-n)<=1&&list[k][0]!==list[i][0]);
  if(others.length<3)others=list.map((e,k)=>k).filter(k=>k!==i&&list[k][0]!==list[i][0]);
  if(others.length<3)return null;
  return "lw:"+lg+":"+c+":"+[i].concat(shuf(others).slice(0,3)).join(".");
}
function qById(id){
  if(typeof id!=="string")return null;
  if(id.startsWith("lw:")){
    const [,lg,c,nums]=id.split(":"),L=HMW[lg]&&HMW[lg][c];if(!L)return null;
    const ks=String(nums||"").split(".").map(Number);if(ks.length!==4||ks.some(k=>!L[k]))return null;
    const words=ks.map(k=>L[k][0]),letters=[...words[0]];
    let ord=R.shuffledOrder(letters.length,id).map(k=>letters[k]);
    if(ord.join("")===letters.join("")&&letters.length>1)ord=ord.slice(1).concat(ord[0]);
    return{id,c:"letters",d:2,lw:{lg,tiles:ord},q:["Unscramble the letters. Which word is it?","رتّب الحروف: ما الكلمة؟"],a:[words,words]};
  }
  return QB?QB.get(id)||null:null;
}
// the order the four answers are shown in, the same on the big screen and every phone: ord[slot] = answer number
const qOrder=(r,i,id)=>R.shuffledOrder(4,code+"|"+r+"|"+i+"|"+id);
const qText=(q,l)=>q.q[l==="ar"?1:0];
const qAns=(q,l)=>q.a[l==="ar"?1:0];
const tpName=k=>t("tp_"+k);

/* ---------- trivia: picking a round ---------- */
let trUsed=new Set();try{trUsed=new Set(JSON.parse(localStorage.getItem("rush-party-tq")||"[]"))}catch(e){}
function rememberUsed(ids){ids.forEach(id=>{if(!id.startsWith("lw:"))trUsed.add(id)});const a=[...trUsed].slice(-500);trUsed=new Set(a);try{localStorage.setItem("rush-party-tq",JSON.stringify(a))}catch(e){}}
function pickRound(topic,lg){
  const all=[...QB.values()],plan=[1,1,2,2,3],out=[];
  const take=(pool,d)=>{let p=pool.filter(x=>!trUsed.has(x.id)&&!out.includes(x.id));if(!p.length)p=pool.filter(x=>!out.includes(x.id));if(!p.length)return null;
    const exact=p.filter(x=>x.d===d);const q=pickOf(exact.length?exact:p);out.push(q.id);return q};
  if(topic==="letters"){for(let k=0;k<TQ_N;k++){const id=letterQ(lg);if(id)out.push(id)}return out}
  if(topic==="mix"){
    // five topics, one of them shown as a picture, and one letter scramble in the middle
    const cats=shuf(TQ.CATS.slice()),picSlot=Math.random()<.5?1:3;
    plan.forEach((d,k)=>{
      if(k===2){const id=letterQ(lg);if(id){out.push(id);return}}
      if(k===picSlot&&take(all.filter(x=>x.img),d))return;
      take(all.filter(x=>!x.img&&x.c===cats[k]),d)||take(all.filter(x=>!x.img),d);
    });
    return out;
  }
  // one topic: its picture questions mixed in (flags: mostly pictures)
  const pics=all.filter(x=>x.c===topic&&x.img),text=all.filter(x=>x.c===topic&&!x.img);
  const nPic=Math.min(pics.length,topic==="flags"?3:pics.length?2:0),slots=shuf([0,1,2,3,4]).slice(0,nPic);
  plan.forEach((d,k)=>{if(slots.includes(k)&&take(pics,d))return;take(text,d)||take(pics,d)});
  return out;
}

/* ---------- trivia on the big screen ---------- */
let tg=null; // {r, ids, i, ph: count|q|rev|res, qAt, end, fast, revAt, lg, tp, last: {cor, picks, hits}}

function trAns(p,i){const a=p.presence.ta;if(!tg||!a||typeof a!=="object"||num(a.r)!==tg.r||!a.a||typeof a.a!=="object")return null;

function trScore(){
  const i=tg.i,id=tg.ids[i],q=qById(id);if(!q)return;const ord=qOrder(tg.r,i,id),cor=ord.indexOf(0),picks=[0,0,0,0],hits=[];

    gRound[who][i]=pts;gTot[who]=(gTot[who]||0)+pts;

function trTick(){

  }

}
const trGm=()=>tg?{k:"tr",r:tg.r,i:tg.i,n:tg.ids.length,ph:tg.ph,id:tg.ids[tg.i],qAt:tg.qAt,end:tg.end,lg:tg.lg,tp:tg.tp,cor:tg.ph==="rev"&&tg.last?tg.last.cor:-1}:{k:"tr",ph:"load"};

/* ---------- hangman on the big screen ---------- */
let hg=null,hmR=0,hmUsed=new Set(); // {r, ph: count|play|res, at, end, lg, c, w, cl: [en, ar], m}
function hmEnter(){gTot={};gRound={};hg=null;hmNext()}
function hmNext(){
  if(!players().length)return;
  const lg=tvGame.lg,L=HMW[lg]||{},cats=Object.keys(L).filter(c=>L[c].length);if(!cats.length)return;
  const c=pickOf(cats);let pool=L[c].map((e,k)=>k).filter(k=>!hmUsed.has(lg+c+k));if(!pool.length){pool=L[c].map((e,k)=>k);[...hmUsed].filter(x=>x.startsWith(lg+c)).forEach(x=>hmUsed.delete(x))}
  const k=pickOf(pool),e=L[c][k];hmUsed.add(lg+c+k);gRound={};
  const now=Rush.now();hg={r:++hmR,ph:"count",at:now+HM_COUNT,end:now+HM_COUNT+HM_MS,lg,c,w:e[0],cl:[e[1],e[2]],m:e[3]};
  pushTv();gKey="";drawGameLive();
}
// one player's state from their guesses: letters found, misses, solved or out of guesses
function hmState(w,g){
  const need=new Set([...w].map(keyOf)),set=new Set([...String(g||"")].filter(ch=>KEYSET.en.has(ch)||KEYSET.ar.has(ch)));
  let hit=0,miss=0;for(const k of set){if(need.has(k))hit++;else miss++}
  return{need:need.size,hit,miss,solved:hit===need.size,out:miss>=HM_MISS,set};
}
function hmPlayer(p){const h=p.presence.hg;if(!hg||!h||typeof h!=="object"||num(h.r)!==hg.r)return{need:new Set([...hg.w].map(keyOf)).size,hit:0,miss:0,solved:false,out:false,t:0,set:new Set()};
  return Object.assign(hmState(hg.w,h.g),{t:num(h.t)})}

}

/* votes on an appeal, with 3 or more players: every phone but the appealer's votes for 15 s, or until all have voted.

  if(role!=="tv"||tvMode!=="harf")return;
  const now=Rush.now();hfTick();
  if(hfView==="arrive"&&now>=hfNextAt&&hfPlayers().length)hfNext(); // later rounds wait for Next round, so everyone can compare answers
  drawHarfLive();
},200);
// the big screen during Harf
function drawHarf(){
  const w=el("section","hf"),head=el("div","hfhead"),mini=el("div","mini");
  mini.append(qrSvg(partyUrl(code)),el("span","code ltrx",code));
  const hd=el("div");hd.style.cssText="display:flex;gap:10px;align-items:center";
  const rl=el("span","pchip");rl.id="hfRound";hd.append(rl,langBtn());
  head.append(mini,hd);
  const body=el("div","hfbody"),center=el("div","hfcenter");center.id="hfCenter";
  const side=el("div","plist");side.id="hfSide";body.append(center,side);
  const foot=el("div","hffoot");foot.id="hfFoot";
  w.append(head,body,foot);view.append(w);lastCenter="";lastFoot="";drawHarfLive();
}
let lastCenter="",lastFoot="",lastSide="";
function drawHarfLive(){
  const center=$("#hfCenter");if(!center)return;
  const now=Rush.now(),P=hfPhase(now),rows=hfRows(),c=hfRound;
  const hfEl=center.closest(".hf");if(hfEl)hfEl.classList.toggle("many",rows.length>7);
  const rl=$("#hfRound");if(rl)rl.textContent=c?t("round",{r:c.r}):t("harf");
  // centre
  let key=hfView+"|"+(c?c.r:0)+"|"+P.ph+"|"+(hs.sa?1:0);
  if(hfView==="results")key+="|"+JSON.stringify(rows.map(r=>[r.id,r.a,r.v,r.rp,r.s,r.apl]))+JSON.stringify(hs.ov)+JSON.stringify(hs.vr)+JSON.stringify(Object.keys(hs.vo).map(k=>[k,hfTally(k,hs.vo[k]),Math.ceil((hs.vo[k].at+VOTE_MS-now)/1000)]))+cap;
  if(hfView==="arrive"||hfView==="wait")key+="|"+rows.length;
  if(key!==lastCenter){lastCenter=key;center.textContent="";
    if(hfView==="arrive"||hfView==="wait"){center.append(el("div","bigmsg",rows.length?t("get"):t("noPlayers")),el("p","pnote",t(hs.ns?"rulesFull":"rules")))}
    else if(hfView==="results")center.append(resultsTable(rows));
    else if(P.ph==="count"){center.append(el("div","bigmsg",t("get")),el("div","secs",""));center.lastChild.id="hfSecs"}
    else if(P.ph==="write"||P.ph==="after"){
      const L=el("div","letter"+(c.lg==="en"?" latin":""),c.L);center.append(L);
      const cats=el("div","cats");H.CATS.forEach(k=>cats.append(el("span",null,t("cat_"+k))));center.append(cats);
      if(P.ph==="write"){const bar=el("div","tbar"+(P.stop?" stop":""));bar.append(el("i"));bar.id="hfBar";const s=el("div","secs");s.id="hfSecs";center.append(bar,s);
        if(hs.sa)center.append(el("div","stopban",t("stopBy",{n:hs.sn||"?"})));else if(hs.ns)center.append(el("p","pnote",t("fullOn")))}
      else center.append(el("div","bigmsg",t("checking")));
    }
  }
  const bar=$("#hfBar");if(bar&&P.ph==="write")bar.firstChild.style.width=Math.max(0,100*P.left/P.total)+"%";
  const secs=$("#hfSecs");if(secs)secs.textContent=String(Math.ceil((P.ph==="count"?P.left:P.left||0)/1000));
  // side: players, live status during a round, scores otherwise
  const side=$("#hfSide");
  const sorted=[...rows].sort((a,b)=>b.s-a.s||a.n.localeCompare(b.n));
  const skey=JSON.stringify([hfView,P.ph,cap,sorted.map(r=>[r.id,r.n,r.c,r.f,r.dn,!!r.v,r.s,r.inRound])]);
  if(side&&skey!==lastSide){lastSide=skey;side.textContent="";
    const live=hfView==="round"&&(P.ph==="write"||P.ph==="after");
    const list=live?rows:sorted;
    list.forEach((r,i)=>{const row=el("div","prow"+(!live&&i===0&&r.s>0?" lead":""));row.append(blob(r.c,null),el("b",null,(r.id===cap?"👑 ":"")+r.n));
      if(live){const st=el("span","st"+(r.dn?" done":""));
        if(r.dn)st.append(document.createTextNode(t("done")));else{const pips=el("span","pips");for(let k=0;k<N;k++)pips.append(el("i",k<r.f?"on":null));st.append(pips)}
        row.append(st)}
      else row.append(el("span","sc ltrx",String(r.s)));
      side.append(row)});
    if(!rows.length)side.append(el("p","pnote",t("noPlayers")));
  }
  // foot: next round countdown, pause, back to lobby
  const foot=$("#hfFoot"),left=Math.max(0,Math.ceil((hfNextAt-now)/1000));
  const fkey=hfView+"|"+lang+"|"+(hfView==="check"?rows.filter(x=>x.inRound&&!(x.v&&x.rp!=null)).length:"");
  if(foot&&fkey!==lastFoot){lastFoot=fkey;foot.textContent="";
    if(hfView==="results"){foot.append(el("span","nx",t("ovHint")));
      const nb=el("button","pbtn",t("nextNow"));nb.type="button";nb.onclick=hfNext;foot.append(nb)}
    else if(hfView==="check"){const n=rows.filter(x=>x.inRound&&!(x.v&&x.rp!=null)).length;foot.append(el("span","nx",n?t("waitPlayers",{n}):""))}
    else foot.append(el("span","nx"));
    const lb=el("button","pbtn ghost",t("lobby"));lb.type="button";lb.onclick=backToLobby;foot.append(lb);
  }
}
// the host's call on an answer: 1 accepts it, 0 rejects it; back to the checker's own verdict clears it
function capNameTv(){const p=activePlayers().find(x=>x.presence.u===cap);return p?shownName(p.presence.n):""}
function hfOverride(id,i,orig,val){const k=id+":"+i;hs.ov=Object.assign({},hs.ov);if(val===(orig?1:0)&&!(k in hs.vr))delete hs.ov[k];else hs.ov[k]=val;
  hfPublish();hfCount();lastCenter="";drawHarfLive()}
// round results: every player's five answers, marked like the phones mark them
function resultsTable(rows){
  // a phone that hasn't sent its checked answers yet still shows what it wrote, greyed out
  const unchecked=rows.filter(r=>r.inRound&&r.a&&!r.v);
  const {inR,pts}=hfScores(rows);
  const wrap=el("div");wrap.style.cssText="width:100%;display:grid;gap:12px";
  wrap.append(el("div","bigmsg",t("results",{r:hfRound.r})+" · "+hfRound.L));
  // votes in progress: the tally; the host can still decide any of them
  const vk=Object.keys(hs.vo||{});
  if(vk.length){const box=el("div","apbox");box.append(el("b",null,t("voteOpen")));
    vk.forEach(k=>{const v=hs.vo[k],T=hfTally(k,v),it=el("div","apit"),w=el("span",null,v.n+" · "+t("cat_"+H.CATS[v.i])+": ");const ww=el("b",null,v.w);ww.dir="auto";w.append(ww);
      const sec=Math.max(0,Math.ceil((v.at+VOTE_MS-Rush.now())/1000));
      const tl=el("span","ltrx",t("voteTally",{y:T.y,n:T.n,d:T.y+T.n,e:T.e,s:sec}));
      const y=el("button","pbtn mint",t("accept"));y.type="button";y.onclick=()=>hfDecide(v.id,v.i,1);
      const n=el("button","pbtn ghost",t("reject"));n.type="button";n.onclick=()=>hfDecide(v.id,v.i,0);it.append(w,tl,y,n);box.append(it)});
    wrap.append(box)}
  // appeals: the host decides (on this screen or on their phone)
  const ap=hfAppeals(rows);
  if(ap.length){const box=el("div","apbox");box.append(el("b",null,t("appealsTv",{n:capNameTv()})));
    ap.forEach(({r,i})=>{const it=el("div","apit"),w=el("span",null,r.n+" · "+t("cat_"+H.CATS[i])+": ");const ww=el("b",null,r.a[i]);ww.dir="auto";w.append(ww);
      const y=el("button","pbtn mint",t("accept"));y.type="button";y.onclick=()=>hfDecide(r.id,i,1);
      const n=el("button","pbtn ghost",t("reject"));n.type="button";n.onclick=()=>hfDecide(r.id,i,0);it.append(w,y,n);box.append(it)});
    wrap.append(box)}
  const tbl=el("table","hres"),th=el("tr");th.append(el("th",null,""));H.CATS.forEach(k=>th.append(el("th",null,t("cat_"+k))));th.append(el("th",null,"+"));
  const thead=el("thead");thead.append(th);tbl.append(thead);const tb=el("tbody");
  inR.map(r=>({r,p:pts[r.id]||H.CATS.map(()=>0)})).sort((x,y)=>y.p.reduce((a,b)=>a+b,0)-x.p.reduce((a,b)=>a+b,0)).forEach(({r,p})=>{
    const tr=el("tr"),who=el("td"),wd=el("div","hwho");wd.append(blob(r.c),el("span",null,r.n));who.append(wd);tr.append(who);
    H.CATS.forEach((k,i)=>{const td=el("td"),w=r.a[i]||"—",ok=r.v[i],ch=(r.id+":"+i) in hs.ov,vt=!ch&&(r.id+":"+i) in hs.vr&&hs.vr[r.id+":"+i]!==null;
      const sp=el(r.a[i]?"button":"span","ans "+(ok?(p[i]>=H.ROOM_UNIQUE?"u":"s"):"x")+(ch?" ov":""));sp.dir="auto";
      sp.append(document.createTextNode(w));
      if(ok||ch||vt){const sm=el("small","ltrx",ok?(p[i]>=H.ROOM_UNIQUE?t("unique"):t("shared")):"✗");if(ch)sm.append(document.createTextNode(" · "+t("ovMark")));else if(vt)sm.append(document.createTextNode(" · "+t("voteMark")));sp.append(sm)}
      if(r.a[i]){sp.type="button";sp.title=t(ok?"reject":"accept");sp.setAttribute("aria-label",r.n+" · "+t("cat_"+k)+": "+w+" · "+t(ok?"reject":"accept"));
        sp.onclick=()=>hfOverride(r.id,i,r.v0[i],ok?0:1)}
      td.append(sp);tr.append(td)});
    const tot=el("td");tot.append(el("span","ltrx","+"+p.reduce((a,b)=>a+b,0)));tr.append(tot);tb.append(tr)});
  unchecked.forEach(r=>{const tr=el("tr","unchk"),who=el("td"),wd=el("div","hwho");wd.append(blob(r.c),el("span",null,r.n));who.append(wd);tr.append(who);
    H.CATS.forEach((k,i)=>{const td=el("td"),sp=el("span","ans x");sp.dir="auto";sp.append(document.createTextNode(r.a[i]||"—"));td.append(sp);tr.append(td)});
    tr.append(el("td",null,t("notChecked")));tb.append(tr)});
  tbl.append(tb);wrap.append(tbl);return wrap;
}

/* ---------- start ---------- */
function boot(){
  const m=location.hash.match(/^#p=([A-Za-z]{4})$/);
  if(m)return bootPhone(m[1].toUpperCase());
  if(location.hash==="#tv"){history.replaceState(null,"",location.pathname)} // a reloaded TV makes a new party
  role=null;draw();
}
window.addEventListener("hashchange",()=>{if(role!=="tv"&&!phoneJoined)boot()});
applyLang();boot();
})();
</script>
