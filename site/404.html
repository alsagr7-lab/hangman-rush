<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<script>(function(){var t;try{t=localStorage.getItem("rush-theme")}catch(e){}if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.setAttribute("data-theme",t)})()</script>
<title>Page not found · Rush Games</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
<style>
/* a standalone page (no shared files), in the Rush look: works even when the rest of the site's files don't load */
:root{color-scheme:dark;--bg:#0B0C10;--surface:#14161D;--line:#23262F;--ink:#F4F1EA;--muted:#9EA3B0;--gold:#F2B544}
:root[data-theme="light"]{color-scheme:light;--bg:#F5F3EE;--surface:#FFFFFF;--line:#E2DED5;--ink:#15161B;--muted:#5A5F6B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.box{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:32px 24px;text-align:center;display:grid;gap:14px}
.code{font-weight:800;font-size:64px;line-height:1;letter-spacing:.04em;color:var(--gold)}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted)}
a.btn{display:block;margin-top:8px;padding:14px 18px;border-radius:16px;background:var(--gold);color:#0B0C10;font-weight:800;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
:root[lang="ar"] body{font-family:"Cairo",system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="code" aria-hidden="true">404</div>
    <h1 id="t">This page doesn't exist</h1>
    <p id="d">The link may be old or mistyped. Today's games are on the main page.</p>
    <a class="btn" id="home" href="/">Go to Rush Games</a>
  </div>
</main>
<script>
(function(){
  var ar=false;
  try{ar=location.pathname.indexOf("/ar/")===0||localStorage.getItem("hr-lang")==="ar"}catch(e){}
  if(!ar)return;
  var h=document.documentElement;h.lang="ar";h.dir="rtl";document.title="الصفحة غير موجودة · ألعاب رش";
  document.getElementById("t").textContent="هذه الصفحة غير موجودة";
  document.getElementById("d").textContent="قد يكون الرابط قديماً أو فيه خطأ. ألعاب اليوم في الصفحة الرئيسية.";
  var a=document.getElementById("home");a.textContent="الذهاب إلى ألعاب رش";a.href="/ar/";
})();
</script>
</body>
</html>
