<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Rush Games admin</title>
<style>
:root{--bg:#eef1f5;--surface:#fff;--sunk:#f5f7fa;--ink:#18202e;--muted:#5d6a7e;--line:#d6dde8;--good:#147a52;--good-bg:#e2f4ec;--hot:#c8372c;--hot-bg:#fbe6e3;
  --warn:#9a6400;--warn-bg:#fdf1d8;--accent:#2b55d6;--accent-bg:#e5ecfd;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--surface:#1d232d;--sunk:#181d26;--ink:#e9edf3;--muted:#98a3b4;--line:#323b49;--good:#5fd3a0;--good-bg:#173528;
  --hot:#ff8577;--hot-bg:#3d1f1c;--warn:#f0c060;--warn-bg:#3a2e14;--accent:#8fb0ff;--accent-bg:#1f2b48;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI","IBM Plex Sans Arabic",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 90px;display:grid;gap:12px}
h1{margin:0;font-size:20px}h2{margin:0;font-size:16px}h3{margin:0;font-size:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.me{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 160px;min-width:0}
input,select,textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}
button{font:inherit;font-weight:650;font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:default}
button.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.yes{background:var(--good-bg);color:var(--good);border-color:transparent}
button.no{background:var(--hot-bg);color:var(--hot);border-color:transparent}
button.sm{padding:4px 9px;font-size:13px}
button.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.note{color:var(--muted);font-size:13px;margin:0}
.err{color:var(--hot)}
[hidden]{display:none!important}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;margin:0 -2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;font-weight:600;padding:8px 11px;color:var(--muted);flex:none}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.tabs .n{font-size:11px;background:var(--hot);color:#fff;border-radius:9px;padding:1px 6px;margin-inline-start:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--sunk);border-radius:10px;padding:10px}
.tile b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12px}
.badge{display:inline-block;font-size:12px;font-weight:650;padding:1px 7px;border-radius:9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.b-good{background:var(--good-bg);color:var(--good)}.b-hot{background:var(--hot-bg);color:var(--hot)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-acc{background:var(--accent-bg);color:var(--accent)}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--surface)}
.item .w{font-size:18px;font-weight:750;overflow-wrap:anywhere}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.list{display:grid;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:start;padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:650;border-top:0}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{white-space:nowrap}
.scroll{overflow-x:auto}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:13px;padding:3px 8px;border-radius:7px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;max-width:100%;overflow-wrap:anywhere;font-weight:600}
.chip.ok{background:var(--good-bg);color:var(--good);border-color:transparent}
.chip.no{background:var(--hot-bg);color:var(--hot);border-color:transparent}
.chip.u{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.e{color:var(--muted);cursor:default;font-weight:400}
.chip .c{font-size:10px;opacity:.75;display:block;font-weight:500}
.prow{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:6px}
.prow:first-child{border-top:0}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ph b{overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.switch{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.switch:first-of-type{border-top:0}
.switch label{display:grid;gap:1px}
.switch small{color:var(--muted);font-size:12px}
.switch input[type=checkbox]{width:22px;height:22px;flex:none}
.switch input[type=number],.switch select{width:120px}
.keybox{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--sunk);border-radius:8px;padding:10px;overflow-wrap:anywhere;user-select:all}
pre{white-space:pre-wrap;font-size:12px;background:var(--sunk);border-radius:8px;padding:10px;margin:0;max-height:420px;overflow:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:90px;padding-top:6px}
.bars div{flex:1;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.ar{background:var(--good)}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.kill{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:10px;background:var(--good-bg)}
.kill.off{background:var(--hot-bg)}
.toast{position:fixed;inset-inline:12px;bottom:14px;max-width:560px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:20;box-shadow:0 6px 24px #0004}
.toast button{background:transparent;color:var(--surface);border-color:#fff6}
.sheet{position:fixed;inset:0;background:#0007;z-index:15;display:flex;justify-content:center;align-items:flex-end}
.sheet .in{background:var(--bg);width:100%;max-width:900px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px 40px;display:grid;gap:10px}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:16px;max-height:88vh}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Rush Games admin</h1><div class="row"><span class="me" id="me"></span><button id="out" class="sm" hidden>Sign out</button></div></div>

  <div class="card" id="login">
    <h2>Sign in</h2>
    <div class="row"><input type="password" id="key" class="grow" placeholder="Your admin or team key" autocomplete="current-password"><button id="go" class="pri">Sign in</button></div>
    <label class="row note"><input type="checkbox" id="remember"> Remember on this device</label>
    <p class="note" id="status"></p>
  </div>

  <nav class="tabs" id="tabs" hidden role="tablist"></nav>
  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden><span id="toastMsg"></span><span class="row"><button id="toastUndo" class="sm" hidden>Undo</button><button id="toastX" class="sm">OK</button></span></div>

<script>
(function(){
"use strict";
/* ---------- basics ---------- */
const $=s=>document.querySelector(s);
// every bit of player text goes in with textContent: names and answers are typed by players
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(v==null||v===false)continue;
  if(k==="class")e.className=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else if(k==="text")e.textContent=v;else if(k in e&&k!=="list")e[k]=v;else e.setAttribute(k,v===true?"":v)}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c instanceof Node?c:document.createTextNode(String(c)))}return e}
const num=n=>Number(n||0).toLocaleString();
const pct=(a,b)=>b?Math.round(100*a/b)+"%":"–";
const CATS=["name","animal","plant","object","place"];
const CAT={name:"Name · إنسان",animal:"Animal · حيوان",plant:"Plant · نبات",object:"Object · جماد",place:"Place · بلاد"};
const CAT1={name:"Name",animal:"Animal",plant:"Plant",object:"Object",place:"Place"};
const LANG={ar:"عربي",en:"EN"};
const GAME={hangman:"Hangman",trivia:"Trivia",harf:"Harf"};
const SRC={ai:["AI, one check",""],ai2:["AI, checked twice","b-acc"],appeal:["appeal","b-acc"],mod:["team","b-good"],list:["word list","b-good"]};
const TYPE={rejected:["AI said no","b-hot"],unchecked:["not checked yet","b-warn"],letter:["wrong first letter","b-warn"],"letter-fix":["AI: other letter","b-warn"]};
const dateOf=t=>{const d=new Date(t);return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+d.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"})};
const today=()=>new Date().toISOString().slice(0,10);
const dayMinus=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const wordOf=k=>k.split("|").slice(2).join("|");

let key="",me=null,tab="review",cache={};
try{key=sessionStorage.getItem("harf-admin")||localStorage.getItem("rush-admin")||"";tab=sessionStorage.getItem("admin-tab")||"review";$("#remember").checked=!!localStorage.getItem("rush-admin")}catch(e){}
$("#key").value=key;

async function api(path,body){
  const opts={cache:"no-store",headers:{"x-admin-key":key,"Content-Type":"application/json"}};
  if(body!==undefined){opts.method="POST";opts.body=JSON.stringify(body)}
  const r=await fetch(path,opts);
  const ct=r.headers.get("content-type")||"";
  const j=ct.includes("json")?await r.json().catch(()=>({})):await r.text();
  if(!r.ok)throw new Error((j&&j.error)||("HTTP "+r.status));
  return j;
}
const can=p=>me&&me.perms.includes(p);

/* ---------- changes: every one goes through the action endpoint, with an undo in the toast ---------- */
let toastT=0;
function toast(msg,undoId){
  $("#toastMsg").textContent=msg;$("#toast").hidden=false;
  const u=$("#toastUndo");u.hidden=!undoId;
  u.onclick=async()=>{u.disabled=true;try{await api("/api/mod/undo",{id:undoId});toast("Undone");refresh()}catch(e){toast(e.message)}finally{u.disabled=false}};
  clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").hidden=true,undoId?9000:4000);
}
$("#toastX").onclick=()=>$("#toast").hidden=true;
async function act(name,args,label,btn){
  if(btn)btn.disabled=true;
  try{const r=await api("/api/mod/act",{act:name,args});
    if(r.proposed)toast("Sent for approval");else toast(label||"Done",r.log);
    return r}
  catch(e){toast(e.message);throw e}
  finally{if(btn)btn.disabled=false}
}

/* ---------- sign in ---------- */
async function signIn(){
  key=$("#key").value.trim();
  const st=$("#status");st.className="note";st.textContent="Checking…";
  try{
    const r=await api("/api/mod/me");me=r.me;
    try{sessionStorage.setItem("harf-admin",key);if($("#remember").checked)localStorage.setItem("rush-admin",key);else localStorage.removeItem("rush-admin")}catch(e){}
    st.textContent="";$("#login").hidden=true;$("#out").hidden=false;
    $("#me").textContent=me.name+" · "+me.role;
    buildTabs();show(TABS.some(t=>t[0]===tab&&t[2]())?tab:"review");
  }catch(e){st.className="note err";st.textContent=e.message;$("#login").hidden=false;$("#tabs").hidden=true;$("#view").textContent=""}
}
$("#go").onclick=signIn;$("#key").addEventListener("keydown",e=>{if(e.key==="Enter")signIn()});
$("#out").onclick=()=>{try{sessionStorage.removeItem("harf-admin");localStorage.removeItem("rush-admin")}catch(e){}location.reload()};

/* ---------- tabs ---------- */
const TABS=[
  ["review","Review",()=>true,review],
  ["answers","Answers",()=>true,answers],
  ["players","Players",()=>true,players],
  ["words","Words",()=>true,words],
  ["stats","Stats",()=>true,stats],
  ["settings","Settings",()=>true,settings],
  ["agents","Agents",()=>true,agentsTab],
  ["team","Team",()=>can("team"),team],
  ["log","Log",()=>true,logTab],
];
function buildTabs(){
  const t=$("#tabs");t.textContent="";t.hidden=false;
  for(const[id,label,ok]of TABS)if(ok())t.append(h("button",{"data-tab":id,role:"tab",onclick:()=>show(id)},label,h("span",{class:"n",id:"n-"+id,hidden:true})));
}
function show(id){
  tab=id;try{sessionStorage.setItem("admin-tab",id)}catch(e){}
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===id)));
  refresh();
}
function refresh(){const v=$("#view");v.textContent="";const t=TABS.find(x=>x[0]===tab);v.append(h("div",{class:"card"},h("p",{class:"note"},"Loading…")));
  t[3]().then(nodes=>{v.textContent="";v.append(h("div",{style:"display:grid;gap:12px"},nodes))}).catch(e=>{v.textContent="";v.append(h("div",{class:"card"},h("p",{class:"note err"},e.message)))})}
function badge(n,id){const b=$("#n-"+id);if(b){b.hidden=!n;b.textContent=n>99?"99+":n}}

/* ---------- player sheet: one player's history, answer by answer ---------- */
async function openPlayer(id){
  const sh=h("div",{class:"sheet",onclick:e=>{if(e.target===sh)sh.remove()}}),inner=h("div",{class:"in"},h("p",{class:"note"},"Loading…"));
  sh.append(inner);document.body.append(sh);
  const draw=async()=>{
    const p=await api("/api/harf/admin/player?id="+encodeURIComponent(id));
    inner.textContent="";
    inner.append(h("div",{class:"top"},h("h2",{dir:"auto"},p.name||"(no name)"),h("button",{class:"sm",onclick:()=>sh.remove()},"Close")),
      h("div",{class:"row"},h("span",{class:"badge"},"id "+p.uid),p.signedIn?h("span",{class:"badge b-acc"},"signed in"):h("span",{class:"badge"},"guest"),p.hidden?h("span",{class:"badge b-hot"},"hidden from boards"):null,
        can("players")?h("button",{class:"sm",onclick:async e=>{await act("players.hide",{game:"harf",id:p.uid,hide:!p.hidden},p.hidden?"Shown on the boards":"Hidden from the boards",e.target);draw()}},p.hidden?"Show on boards":"Hide from boards"):null));
    if(!Object.keys(p.langs).length)inner.append(h("p",{class:"note"},"No Harf days yet."));
    for(const[lg,L]of Object.entries(p.langs)){
      inner.append(h("div",{class:"card"},
        h("div",{class:"ph"},h("h3",null,lg==="ar"?"Arabic daily":"English daily"),h("span",{class:"note"},`streak ${L.streak} · best ${L.best} · played ${L.played} · perfect ${L.wins} · appeals today ${L.appealsToday}`)),
        L.open?h("p",{class:"note"},`Playing now: letter ${L.open.L}, ${Math.ceil(L.open.left/1000)}s left`):null,
        h("div",null,L.days.slice(0,60).map(d=>h("div",{class:"prow"},
          h("div",{class:"ph"},h("b",null,d.day+" · "+(d.L||"?")),h("span",{class:"note"},`${d.pts} pts (${d.c}/5${d.sb?" +"+d.sb+" streak":""}${d.rb!=null?" +"+d.rb+" rare":", rarity pending"}) · ${Math.round(d.t/1000)}s${d.live?"":" · archive"}`)),
          answerChips(d.a,d.live&&can("review")?(a,i)=>toggleAnswer({id:L.id,day:d.day,i},a,draw):null))))));
    }
  };
  draw().catch(e=>{inner.textContent="";inner.append(h("p",{class:"err"},e.message))});
}
function chipClass(a){return !a.w?"e":a.ok?"ok":a.u?"u":"no"}
function chipTitle(a){const t=[];if(a.f)t.push("→ "+a.f);if(a.l)t.push("wrong letter");if(a.u)t.push("not checked yet");if(a.ap===1)t.push("appeal won");if(a.ap===-1)t.push("appeal lost");if(a.mo)t.push("decided by the team");if(a.why)t.push(a.why);if(a.n)t.push(a.n+" gave it");return t.join(" · ")}
function answerChips(list,onTap){
  return h("div",{class:"chips"},list.map((a,i)=>{
    const c=h("button",{class:"chip "+chipClass(a),title:chipTitle(a),dir:"auto",disabled:!a.w||!onTap,onclick:()=>onTap&&a.w&&onTap(a,i)},
      h("span",{class:"c"},CAT1[CATS[i]]+(a.mo?" · team":a.ap===-1?" · appeal lost":a.l?" · letter":a.u?" · unchecked":"")),a.w||"—",a.f&&a.ok?" → "+a.f:"");
    return c}));
}
async function toggleAnswer(sel,a,after){
  const ok=a.ok?0:1;
  if(!confirm((ok?"Count":"Don't count")+" \""+a.w+"\" for this player only?\n\nTo decide the word for everyone, use Valid / Not valid on the Answers or Review tab."))return;
  await act("harf.answer",Object.assign({ok},sel),ok?"Counted":"Not counted");after&&after();
}

/* ---------- Review ---------- */
let rv={days:3,type:"",lg:""};
async function review(){
  const [q,props]=await Promise.all([api("/api/harf/admin/queue?days="+rv.days),api("/api/mod/proposals").catch(()=>({list:[]}))]);
  const pending=props.list.filter(p=>p.status==="pending");
  badge(q.list.length+pending.length,"review");
  const out=[];
  if(pending.length)out.push(h("div",{class:"card"},h("h2",null,"Waiting for your OK ("+pending.length+")"),h("p",{class:"note"},"Agents in propose mode suggest changes here instead of making them."),
    h("div",{class:"list"},pending.map(p=>h("div",{class:"item"},h("div",null,h("b",null,p.by.name)," wants ",h("b",null,p.act)),
      h("pre",null,JSON.stringify(p.args)),p.why?h("div",{class:"note",dir:"auto"},"Why: "+p.why):null,
      can("review")?h("div",{class:"row"},h("button",{class:"yes",onclick:async e=>{e.target.disabled=true;try{const r=await api("/api/mod/proposals",{id:p.id,ok:true});toast(r.status==="approved"?"Approved and done":"Failed: "+(r.error||""),r.log)}catch(x){toast(x.message)}refresh()}},"Approve"),
        h("button",{class:"no",onclick:async()=>{await api("/api/mod/proposals",{id:p.id,ok:false});toast("Rejected");refresh()}},"Reject")):null)))));
  const list=q.list.filter(g=>(!rv.type||g.type===rv.type||(rv.type==="letter"&&g.type==="letter-fix"))&&(!rv.lg||g.lg===rv.lg));
  const sel=(v,opts,on)=>h("select",{onchange:e=>on(e.target.value)},opts.map(([val,l])=>h("option",{value:val,selected:String(v)===String(val)},l)));
  out.push(h("div",{class:"card"},
    h("div",{class:"ph"},h("h2",null,"Review queue"),h("span",{class:"note"},list.length+" to look at")),
    h("p",{class:"note"},"Daily answers that didn't count, grouped by word, most important first (lost appeals, then how many players gave it). Valid / Not valid decides the word for everyone for good and re-scores the last 3 days. Skip just hides it here."),
    h("div",{class:"row"},sel(rv.days,[[1,"Today"],[3,"3 days"],[7,"7 days"],[14,"14 days"]],v=>{rv.days=+v;refresh()}),
      sel(rv.type,[["","Everything"],["rejected","AI said no"],["unchecked","Not checked"],["letter","Letter cases"]],v=>{rv.type=v;refresh()}),
      sel(rv.lg,[["","Both languages"],["ar","Arabic"],["en","English"]],v=>{rv.lg=v;refresh()})),
    list.length?h("div",{class:"list"},list.map(reviewItem)):h("p",{class:"note"},"Nothing waiting. 🎉")));
  return out;
}
function reviewItem(g){
  const t=TYPE[g.type]||[g.type,""],box=h("div",{class:"item"});
  const done=msg=>{box.style.opacity=.45;box.querySelectorAll("button").forEach(b=>b.disabled=true);const n=$("#n-review");if(n&&+n.textContent>1)n.textContent=+n.textContent-1};
  const v=g.verdict;
  // (DOM append() would print a null as text: everything goes through h(), which skips them)
  box.append(...[h("div",{class:"w",dir:"auto"},g.words.join(" / ")),
    h("div",{class:"meta"},h("span",{class:"badge "+t[1]},t[0]),h("span",null,LANG[g.lg]+" · "+CAT[g.cat]+" · letter "+g.letter),
      h("span",{class:"badge"},g.n+" player"+(g.n===1?"":"s")),g.lost?h("span",{class:"badge b-hot"},g.lost+" lost appeal"+(g.lost===1?"":"s")):null,
      v?h("span",{class:"badge "+(SRC[v.src]||["",""])[1]},"saved: "+(v.ok?"valid":"not valid")+", "+(SRC[v.src]||[v.src])[0]):null,
      h("span",null,g.days.join(", "))),
    g.fix?h("div",{class:"note",dir:"auto"},"AI's spelling: "+g.fix+(g.type==="letter-fix"?" (starts with another letter)":"")):null,
    g.why?h("div",{class:"note",dir:"auto"},"Appeal referee: "+g.why):null].filter(Boolean));
  const who=h("details",null,h("summary",null,"Who gave it"),h("div",{class:"row"},g.players.map(p=>h("button",{class:"link",dir:"auto",onclick:()=>openPlayer(p.id)},(p.name||"(no name)")+" · "+p.day))));
  box.append(who);
  if(!can("review"))return box;
