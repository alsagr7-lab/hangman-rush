databases:
  - name: hangman-rush-db
    plan: free
    databaseName: hangman
    user: hangman

services:
  - type: web
    name: hangman-rush
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hangman-rush-db
          property: connectionString
