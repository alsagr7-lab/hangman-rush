databases:
  - name: hangman-rush-db
    plan: free
    databaseName: hangman
    user: hangman

services:
  # The game server: live rooms, daily words and questions, leaderboards. Free web services sleep after 15 idle minutes.
  - type: web
    name: hangman-rush
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hangman-rush-db
          property: connectionString
      - key: DAILY_KEY
        sync: false
      # unlocks daily-words-ar.enc, the Arabic Hangman daily word
      - key: DAILY_AR_KEY
        sync: false
      - key: TRIVIA_KEY
        sync: false
      # optional: lets Harf Rush check that answers fit their category (without it, only the first letter is checked)
      - key: ANTHROPIC_API_KEY
        sync: false
      # optional: a password of your choosing for the admin page at /admin
      - key: ADMIN_KEY
        sync: false
      # optional: turns on "Sign in with Google" (an OAuth web client id; no secret needed)
      - key: GOOGLE_CLIENT_ID
        sync: false
      # the static site's address, e.g. https://rushgames.cc (offers players a move to it)
      - key: SITE_URL
        sync: false
      # optional: "on" shows the hidden Rush+ subscription links (keep off until plans are ready)
      - key: SUBSCRIPTIONS
        sync: false

  # The pages, as a free static site: never sleeps and uses none of the free instance hours.
  - type: web
    name: rush-games
    runtime: static
    staticPublishPath: ./dist
    # Each page is built as one file with the shared styles and scripts inside.
    # API_URL is the game server's address, e.g. https://api.rushgames.cc
    buildCommand: node scripts/build-site.js
    envVars:
      - key: API_URL
        sync: false
      # optional: "on" shows the hidden Rush+ subscription links (keep off until plans are ready)
      - key: SUBSCRIPTIONS
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      # Cloudflare keeps its own copy of the pages; this tells it to check for a new one each time, so an update
      # shows straight away instead of after its copy expires
      - path: /*
        name: Cloudflare-CDN-Cache-Control
        value: no-cache
